name: Validate and release card

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Verify published artifact is current
        run: git diff --exit-code -- dist/clm-card.js

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the validated card and browser module
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable semantic version in package.json'; exit 1; }
          tag="v$version"
          if state=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$state" == 'false' ]]; then
              git fetch origin "refs/tags/$tag:refs/tags/$tag"
              if ! git diff --quiet "$tag" HEAD -- src dist/clm-card.js package.json hacs.json; then
                echo 'Card code changed after this release. Bump package.json version before publishing.'
                exit 1
              fi
              echo "$tag is already published with the same card files."
              exit 0
            fi
            target=$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')
            [[ "$target" == "$GITHUB_SHA" ]] || { echo 'An existing draft targets another commit. Resolve it before retrying.'; exit 1; }
          else
            cat > release-notes.md <<'NOTES'
          Companion workspace card update.

          Includes the tested clm-card.js browser module. Update the integration and card together when connection features change.
          NOTES
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$version" --notes-file release-notes.md
          fi
          gh release upload "$tag" dist/clm-card.js --clobber
          gh release edit "$tag" --draft=false --latest
